<!DOCTYPE html>
<html>
<head>
    <title>Admin Dashboard</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="style.css">

    <!-- Protect page -->
    <script>
        const isLoggedIn = sessionStorage.getItem("admin");
        if (!isLoggedIn) {
            window.location.href = "admin-login.html";
        }
    </script>

    <!-- Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>

    <!-- jsPDF (for PDF export) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

</head>

<body>

<!-- =========================
     NAVBAR
========================= -->
<div class="navbar">

    <h2>Baby Shower Admin</h2>

    <div class="nav-actions">

        <button onclick="exportToCSV()" class="nav-btn">
            Export CSV
        </button>

        <button onclick="exportToPDF()" class="nav-btn">
            Export PDF
        </button>

        <button onclick="clearAll()" class="nav-btn clear">
            Clear List
        </button>

        <button onclick="logout()" class="nav-btn logout">
            Logout
        </button>

    </div>

</div>

<!-- =========================
     MAIN CONTENT
========================= -->
<div class="wrapper">

    <div class="dashboard">

        <!-- STATS -->
        <div class="stats">
            <div class="card-stat accepted">
                <h3 id="acceptedCount">0</h3>
                <p>Accepted</p>
            </div>

            <div class="card-stat declined">
                <h3 id="declinedCount">0</h3>
                <p>Declined</p>
            </div>
        </div>

        <!-- ACCEPTED -->
        <h2>Accepted Guests</h2>
        <div class="table-wrapper">
            <table>
                <thead>
                <tr><th>Name</th></tr>
                </thead>
                <tbody id="acceptedTable"></tbody>
            </table>
        </div>

        <!-- DECLINED -->
        <h2>Declined Guests</h2>
        <div class="table-wrapper">
            <table>
                <thead>
                <tr><th>Name</th></tr>
                </thead>
                <tbody id="declinedTable"></tbody>
            </table>
        </div>

    </div>

</div>

<!-- =========================
     SCRIPTS (ORDER MATTERS)
========================= -->
<script src="supabase.js"></script>
<script src="admin.js"></script>

</body>
</html>
